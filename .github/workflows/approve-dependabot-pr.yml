name: "Approve Dependabot PR's"
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependabot:
    # Approves and auto-merges Dependabot minor and patch updates once every commit on the
    # PR is verified to come from dependabot[bot]. Major updates are left for a human.
    permissions:
      contents: write
      pull-requests: write
      actions: write # the reusable workflow requests it for github-actions updates; without it the run is a startup_failure
    uses: devops-actions/.github/.github/workflows/approve-dependabot-pr.yml@f2b5c26c77264c245360c3f1f2d279947cc86503 # v1.2.0
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
